name: Validate questions

on:
  push:
    paths:
      - "data/questions.json"
      - "scripts/validate-questions.js"
  pull_request:
    paths:
      - "data/questions.json"
      - "scripts/validate-questions.js"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-questions.js
