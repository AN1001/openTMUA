<text x="130" y="256" text-anchor="middle" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(17, 17, 17);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">must cross the line</text>

