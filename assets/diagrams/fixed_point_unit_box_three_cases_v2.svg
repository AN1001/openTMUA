<svg width="100%" viewBox="0 0 680 285" role="img" xmlns="http://www.w3.org/2000/svg" style=""><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(17, 17, 17);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Fixed points as intersections with y = x</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(17, 17, 17);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Three centered unit boxes: a continuous self-map of the closed interval forced to cross the diagonal; x squared on the open interval sliding into the excluded corner; a strictly decreasing map crossing the diagonal exactly once.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="130" y="48" text-anchor="middle" style="fill:rgb(17, 17, 17);stroke:none;color:rgb(17, 17, 17);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:auto">I. closed [0,1]</text>
<rect x="50" y="70" width="160" height="160" fill="none" stroke="#999" stroke-width="0.5" style="fill:none;stroke:rgb(153, 153, 153);color:rgb(17, 17, 17);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
